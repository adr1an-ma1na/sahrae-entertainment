<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <title>Concept 3 — Reel S (film-strip ribbon forming the letter S)</title>
  <defs>
    <radialGradient id="bg3" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="reel3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg3)"/>

  <!-- The film-strip S, drawn as a thick stroked path -->
  <g filter="url(#shadow3)">
    <path d="
      M 720 320
      C 720 240, 640 190, 530 190
      L 430 190
      C 320 190, 240 250, 240 360
      C 240 450, 310 500, 420 520
      L 540 540
      C 620 555, 660 580, 660 620
      C 660 680, 590 720, 480 720
      L 320 720
      "
      fill="none" stroke="url(#reel3)" stroke-width="160" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sprocket holes along the strip: small dark rounded rects spaced along the S path -->
    <!-- Top arc holes -->
    <g fill="#0c0a09">
      <rect x="430" y="155" width="28" height="40" rx="8"/>
      <rect x="510" y="155" width="28" height="40" rx="8"/>
      <rect x="430" y="225" width="28" height="40" rx="8"/>
      <rect x="510" y="225" width="28" height="40" rx="8"/>

      <!-- Middle (diagonal of S) -->
      <rect x="285" y="370" width="28" height="40" rx="8" transform="rotate(-15 299 390)"/>
      <rect x="365" y="385" width="28" height="40" rx="8" transform="rotate(-15 379 405)"/>
      <rect x="570" y="555" width="28" height="40" rx="8" transform="rotate(15 584 575)"/>
      <rect x="640" y="585" width="28" height="40" rx="8" transform="rotate(15 654 605)"/>

      <!-- Bottom arc holes -->
      <rect x="370" y="650" width="28" height="40" rx="8"/>
      <rect x="450" y="650" width="28" height="40" rx="8"/>
      <rect x="370" y="720" width="28" height="40" rx="8"/>
      <rect x="450" y="720" width="28" height="40" rx="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="512" y="900" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="68" font-weight="900" letter-spacing="14" fill="#f5f5f4">SAHRAE</text>
  <text x="512" y="950" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="300" letter-spacing="10" fill="#a1a1aa">ENTERTAINMENT</text>
</svg>
