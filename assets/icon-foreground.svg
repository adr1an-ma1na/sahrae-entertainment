<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Sahrae Entertainment — Adaptive Foreground (gold S monogram)</title>
  <defs>
    <linearGradient id="goldS" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="28%" stop-color="#fcd34d"/>
      <stop offset="58%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="sGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hero gold S, centred within the Android adaptive safe zone -->
  <g filter="url(#sGlow)">
    <g transform="translate(540 512) scale(1.5) translate(-512 -512)">
      <path d="M 600 432 C 600 393 562 370 510 370 L 465 370 C 420 370 386 393 386 432 C 386 466 414 482 454 493 L 510 504 C 562 515 590 538 590 577 C 590 616 552 639 500 639 L 410 639"
        fill="none" stroke="url(#goldS)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Soft top sheen ridge for a metallic finish -->
  <g transform="translate(540 504) scale(1.5) translate(-512 -512)" opacity="0.45">
    <path d="M 600 432 C 600 393 562 370 510 370 L 465 370 C 420 370 386 393 386 432 C 386 466 414 482 454 493 L 510 504 C 562 515 590 538 590 577 C 590 616 552 639 500 639 L 410 639"
      fill="none" stroke="#fff7e0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
