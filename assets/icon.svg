    C 420 370, 386 393, 386 432
    C 386 466, 414 482, 454 493
    L 510 504
    C 562 515, 590 538, 590 577
    C 590 616, 552 639, 500 639
    L 410 639
    "
    fill="none" stroke="#7c2d12" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"
    opacity="0.92"/>

  <path d="
    M 0 720
    C 180 660, 320 700, 480 690
    C 640 680, 780 720, 1024 700
    L 1024 1024 L 0 1024 Z
    "
    fill="#7c2d12" opacity="0.65"/>

  <path d="
    M 0 800
    C 200 760, 380 820, 560 800
    C 720 785, 880 830, 1024 810
    L 1024 1024 L 0 1024 Z
