name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app (Vite)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install rsvg-convert (SVG → PNG)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Rasterize source SVGs to PNGs
        run: |
          rsvg-convert -w 1024 -h 1024 assets/icon.svg            -o assets/icon.png
          rsvg-convert -w 1024 -h 1024 assets/icon-foreground.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 assets/icon-background.svg -o assets/icon-background.png
          rsvg-convert -w 2732 -h 2732 assets/splash.svg          -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          ls -la assets/

      - name: Generate Android icon + splash assets
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahrae-entertainment-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
