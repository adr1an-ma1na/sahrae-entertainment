name: Deploy PWA to GitHub Pages

# Publishes the installable web app. The Android workflow is unaffected: this
# builds with GH_PAGES=1, which is the only thing that switches Vite's `base` to
# the /sahrae-entertainment/ subpath GitHub Pages serves from.

on:
  push:
    branches: [hardening-2026-07, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build PWA
        env:
          GH_PAGES: '1'
        run: npx vite build

      - name: SPA fallback
        # Pages serves static files only. Copying index.html to 404.html makes any
        # deep link fall back to the app shell instead of a GitHub 404 page.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
