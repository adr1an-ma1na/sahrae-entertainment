name: Generate Release Keystore (one-time)

# This workflow is fired manually from the Actions tab.
# It creates a fresh Android signing keystore, prints the four secret
# values you need to copy, and uploads the keystore as a downloadable
# artifact. After you've copied the secrets into the repo, you can
# disable or delete this workflow.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (any name, no spaces)'
        required: true
        default: 'sahrae'
      dname:
        description: 'X.500 distinguished name (CN=..., O=..., L=..., ST=..., C=...)'
        required: true
        default: 'CN=Sahrae Entertainment, O=Sahrae, L=Nairobi, ST=Nairobi, C=KE'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        id: keystore
        env:
          ALIAS: ${{ inputs.alias }}
          DNAME: ${{ inputs.dname }}
        run: |
          STORE_PASS=$(openssl rand -base64 33 | tr -d '\n' | tr -d '/+=' | head -c 32)
          KEY_PASS=$(openssl rand -base64 33 | tr -d '\n' | tr -d '/+=' | head -c 32)

          keytool -genkeypair -v \
            -keystore sahrae-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"

          base64 -w 0 sahrae-release.jks > keystore.b64

          # Write the four secret values to a structured file so the caller
          # can download and pipe them straight into `gh secret set`.
          mkdir -p out
          cp sahrae-release.jks out/sahrae-release.jks
          cp keystore.b64       out/KEYSTORE_BASE64.txt
          printf "%s" "$STORE_PASS" > out/KEYSTORE_PASSWORD.txt
          printf "%s" "$ALIAS"      > out/KEY_ALIAS.txt
          printf "%s" "$KEY_PASS"   > out/KEY_PASSWORD.txt
          ls -la out/

          echo "## ✅ Keystore generated" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **sahrae-release-keystore** artifact below and set the four secrets from its files." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: sahrae-release-keystore
          path: out/
          retention-days: 1
