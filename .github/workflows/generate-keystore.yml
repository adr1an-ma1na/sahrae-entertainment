name: Generate Release Keystore (one-time)

# This workflow is fired manually from the Actions tab.
# It creates a fresh Android signing keystore, prints the four secret
# values you need to copy, and uploads the keystore as a downloadable
# artifact. After you've copied the secrets into the repo, you can
# disable or delete this workflow.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (any name, no spaces)'
        required: true
        default: 'sahrae'
      dname:
        description: 'X.500 distinguished name (CN=..., O=..., L=..., ST=..., C=...)'
        required: true
        default: 'CN=Sahrae Entertainment, O=Sahrae, L=Nairobi, ST=Nairobi, C=KE'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        id: keystore
        env:
          ALIAS: ${{ inputs.alias }}
          DNAME: ${{ inputs.dname }}
        run: |
          # Random passwords so the generated keystore is unique per run
          STORE_PASS=$(openssl rand -base64 33 | tr -d '\n' | tr -d '/+=' | head -c 32)
          KEY_PASS=$(openssl rand -base64 33 | tr -d '\n' | tr -d '/+=' | head -c 32)

          keytool -genkeypair -v \
            -keystore sahrae-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"

          KEYSTORE_B64=$(base64 -w 0 sahrae-release.jks)

          # Save to step outputs (masked-ish — but ALSO printed in the job
          # summary, which only repo collaborators can see).
          {
            echo "## ✅ Keystore generated"
            echo ""
            echo "Run these four commands locally to wire the keystore into the build:"
            echo ""
            echo '```bash'
            echo "gh secret set KEYSTORE_BASE64   -R adr1an-ma1na/sahrae-entertainment -b '$KEYSTORE_B64'"
            echo "gh secret set KEYSTORE_PASSWORD -R adr1an-ma1na/sahrae-entertainment -b '$STORE_PASS'"
            echo "gh secret set KEY_ALIAS         -R adr1an-ma1na/sahrae-entertainment -b '$ALIAS'"
            echo "gh secret set KEY_PASSWORD      -R adr1an-ma1na/sahrae-entertainment -b '$KEY_PASS'"
            echo '```'
            echo ""
            echo "**KEEP THESE SECRETS SAFE.** Losing them means you can never produce a signed update for this app."
            echo ""
            echo "After copying, delete this workflow run (and the workflow file itself) so the secrets do not leak via logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact (for offline backup)
        uses: actions/upload-artifact@v4
        with:
          name: sahrae-release-keystore
          path: sahrae-release.jks
          retention-days: 1
