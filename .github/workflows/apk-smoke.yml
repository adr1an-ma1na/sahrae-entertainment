name: APK smoke test

# Installs the published release APK on a real Android emulator, launches it,
# and checks what is actually on screen. The build can succeed while the app
# opens to a blank white page, and "the process is running" is true in that
# case too — the first version of this test passed an Android 9 run that
# showed nothing at all. So the check is about pixels and text:
#
#   modern WebView (>= 111)  the app must draw real content, not a blank page
#   outdated WebView         the native "One quick update needed" dialog must
#                            appear, instead of a silent white screen

on:
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [34, 28]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download preview --repo "${{ github.repository }}" --pattern Sahrae-release.apk --dir .
          ls -l Sahrae-release.apk
          pip install --quiet pillow

      - name: Write the screen check
        run: |
          cat > blank.py <<'PY'
          # Distinct colours below the status bar. A blank page is one or two;
          # the app's welcome screen has hundreds (gradients, text, artwork).
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert('RGB')
          w, h = im.size
          body = im.crop((0, int(h * 0.06), w, h)).resize((160, 300))
          n = len(set(body.getdata()))
          print(n)
          PY

      - name: Install, launch, verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/apk-smoke-verify.sh ${{ matrix.api }}

      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api }}
          path: |
            logcat.txt
            screen.png
            ui.xml
            webview.txt
            screen-after-renderer-loss.png
          if-no-files-found: ignore
