<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/pwa-icon.svg">
    <!-- No hand-written manifest link. vite-plugin-pwa injects one whose
         start_url and scope are derived from the build's `base`, so the app
         installs correctly at the root (APK / Firebase) and at the
         /sahrae-entertainment/ subpath (GitHub Pages) without edits. The old
         public/manifest.json hardcoded start_url "/" and won over the generated
         one, so an installed shortcut opened the host's root, not the app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sahrae" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Sahrae Entertainment | Movies, Series, Live TV, Sports &amp; Radio</title>

    <!-- Discoverability. A single-page app gives a crawler one document to work
         with, so that document has to carry the whole story: what this is, what
         it shows, and a card worth sharing. Without a description Google
         invents one from whatever text it finds first. -->
    <meta name="description" content="Sahrae Entertainment streams movies, series, live TV channels, live sports and 45 radio stations in one app. Install it on your phone, laptop or TV, with no sign-up needed to start watching." />
    <meta name="keywords" content="Sahrae, streaming, movies, series, live TV, live sports, radio, Kenya, free streaming app" />
    <meta name="author" content="Sahrae Entertainment" />
    <link rel="canonical" href="https://adr1an-ma1na.github.io/sahrae-entertainment/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Link preview card (WhatsApp, X, Facebook, Slack, iMessage). Sharing the
         link is how most people will find this, so the card matters more than
         the search snippet. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sahrae Entertainment" />
    <meta property="og:title" content="Sahrae Entertainment | Movies, Series, Live TV, Sports &amp; Radio" />
    <meta property="og:description" content="Movies, series, live TV, live sports and 45 radio stations in one app. Works on phone, laptop and TV." />
    <meta property="og:url" content="https://adr1an-ma1na.github.io/sahrae-entertainment/" />
    <meta property="og:image" content="https://adr1an-ma1na.github.io/sahrae-entertainment/pwa-icon.svg" />
    <meta property="og:locale" content="en_KE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sahrae Entertainment" />
    <meta name="twitter:description" content="Movies, series, live TV, live sports and 45 radio stations in one app." />
    <meta name="twitter:image" content="https://adr1an-ma1na.github.io/sahrae-entertainment/pwa-icon.svg" />

    <!-- Structured data: tells Google this is an installable application rather
         than an article, which is what earns the app-style result. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sahrae Entertainment",
      "url": "https://adr1an-ma1na.github.io/sahrae-entertainment/",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Android, Windows, macOS, ChromeOS",
      "browserRequirements": "Requires a modern browser with JavaScript enabled",
      "description": "Movies, series, live TV channels, live sports and 45 radio stations in one installable app.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Start-up watchdog. Deliberately ES5 and inline: its job is to run on the
         engines the app itself cannot, so it must not use anything they lack.
         If nothing has rendered after 12 seconds (an outdated WebView that cannot
         parse the app, a failed download, anything), it replaces the blank white
         screen with an explanation and a way forward. -->
    <script>
      (function () {
        var shown = false;
        function show() {
          var root = document.getElementById('root');
          if (shown || (root && root.children.length)) return;
          shown = true;
          var m = navigator.userAgent.match(/Chrome\/(\d+)/);
          var ver = m ? parseInt(m[1], 10) : 0;
          var old = ver && ver < 111;
          var android = /Android/i.test(navigator.userAgent);
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#09090b;color:#f5f5f7;' +
            'font-family:sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:2147483647';
          var msg = old
            ? (android
                ? 'Sahrae needs a newer Android System WebView (this one is version ' + ver + '; 111 or newer is needed). Update "Android System WebView" and "Chrome" in the Play Store, then open Sahrae again.'
                : 'This browser is too old for Sahrae (version ' + ver + '). Update Chrome, or open Sahrae in a current browser.')
            : 'Sahrae is taking longer than usual to start. Check your connection and try again.';
          box.innerHTML = '<div style="max-width:420px">' +
            '<div style="font-size:22px;font-weight:700;color:#fbbf24;margin-bottom:12px">SAHRAE</div>' +
            '<p style="font-size:15px;line-height:1.5;margin:0 0 20px">' + msg + '</p>' +
            (old && android
              ? '<a href="market://details?id=com.google.android.webview" style="display:inline-block;background:#f59e0b;color:#1a1205;font-weight:700;padding:12px 22px;border-radius:999px;text-decoration:none;margin:0 6px 10px">Update WebView</a>'
              : '') +
            '<a href="javascript:location.reload()" style="display:inline-block;border:1px solid #3a3a40;color:#f5f5f7;padding:12px 22px;border-radius:999px;text-decoration:none;margin:0 6px 10px">Try again</a>' +
            '</div>';
          document.body.appendChild(box);
          // A slow first visit can pass 12 seconds and then finish loading. When
          // the app does render, step aside rather than cover it.
          var watch = setInterval(function () {
            if (root && root.children.length) { clearInterval(watch); if (box.parentNode) box.parentNode.removeChild(box); }
          }, 1000);
        }
        setTimeout(show, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
